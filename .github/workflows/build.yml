name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64-msi
            os: windows-latest
            args: --win msi --x64
          # The arm64 application is wrapped in an x64 MSI installer
          # (electron-builder's WiX version has no arm64 support yet);
          # it installs fine on Windows on ARM.
          - name: windows-arm64-msi
            os: windows-latest
            args: --win msi --arm64
          - name: linux-x86_64-appimage
            os: ubuntu-latest
            args: --linux AppImage --x64
          # One deb covers both Ubuntu and Debian.
          - name: linux-x86_64-deb
            os: ubuntu-latest
            args: --linux deb --x64
          # One rpm covers the RHEL family, including AlmaLinux 9/10.
          - name: linux-x86_64-rpm
            os: ubuntu-latest
            args: --linux rpm --x64
          - name: macos-x64-dmg
            os: macos-15-intel
            args: --mac dmg --x64
          - name: macos-arm64-dmg
            os: macos-latest
            args: --mac dmg --arm64
    runs-on: ${{ matrix.os }}
    env:
      # This fork has no signing certificates; do not look for a macOS
      # signing identity in the keychain.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          # Do not restore caches into release builds (cache poisoning).
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # Tag-triggered builds get their version from the tag (minus the
      # leading "v"), so package.json never needs a version-bump commit.
      # workflow_dispatch builds keep the version committed in package.json.
      - name: Set package version from the build tag
        if: github.ref_type == 'tag'
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - name: Adapt electron-builder configuration for fork builds
        run: |
          node -e "
            const fs = require('node:fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            // This fork has no Azure Trusted Signing credentials.
            delete p.build.win.azureSignOptions;
            // Do not install the official Zulip apt repository from fork
            // packages; it would replace this build on the next apt upgrade.
            delete p.build.deb.fpm;
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
      - run: pnpm exec install-electron
      - run: pnpm exec electron-vite build
      - env:
          EB_ARGS: ${{ matrix.args }}
        run: |
          # EB_ARGS holds multiple arguments; word splitting is intended.
          # shellcheck disable=SC2086
          pnpm exec electron-builder $EB_ARGS --publish never
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.msi
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.dmg
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: installers
          merge-multiple: true
      - name: Create GitHub Release with installers attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            installers/*
